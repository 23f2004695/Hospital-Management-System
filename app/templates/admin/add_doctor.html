{% extends "base.html" %}
{% from "macros.html" import csrf %}

{% block title %}Add Doctor{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 py-1"><i class="fas fa-user-plus"></i> Add New Doctor</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {{ csrf() }}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Username *</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ form.get('username', '') }}" maxlength="80" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" required>
                        </div>
                    </div>

                    {% with d = form %}{% include "admin/_doctor_fields.html" %}{% endwith %}

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.manage_doctors') }}" class="btn btn-secondary">Back</a>
                        <button type="submit" class="btn btn-primary">Add Doctor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
