{% extends "base.html" %}
{% from "macros.html" import csrf %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0 py-1"><i class="fas fa-user-pen"></i> My Profile</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {{ csrf() }}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="full_name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" maxlength="100" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ current_user.phone }}" pattern="[+]?[0-9 ]{7,20}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date_of_birth" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" max="{{ today_iso }}" value="{{ current_user.date_of_birth.isoformat() if current_user.date_of_birth else '' }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="">Select gender</option>
                                {% for g in genders %}<option value="{{ g }}" {% if current_user.gender == g %}selected{% endif %}>{{ g }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="blood_group" class="form-label">Blood Group</label>
                            <select class="form-select" id="blood_group" name="blood_group">
                                <option value="">Select blood group</option>
                                {% for bg in blood_groups %}<option value="{{ bg }}" {% if current_user.blood_group == bg %}selected{% endif %}>{{ bg }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="2" maxlength="500">{{ current_user.address or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="emergency_contact" class="form-label">Emergency Contact</label>
                        <input type="tel" class="form-control" id="emergency_contact" name="emergency_contact" value="{{ current_user.emergency_contact or '' }}" pattern="[+]?[0-9 ]{7,20}">
                    </div>

                    <div class="mb-4">
                        <label for="medical_history" class="form-label">Medical History</label>
                        <textarea class="form-control" id="medical_history" name="medical_history" rows="3" maxlength="2000" placeholder="Allergies, ongoing conditions, past surgeries...">{{ current_user.medical_history or '' }}</textarea>
                    </div>

                    <details class="mb-4">
                        <summary class="fw-semibold mb-2">Change password</summary>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="current_password" class="form-label">Current password</label>
                                <input type="password" class="form-control" id="current_password" name="current_password" autocomplete="current-password">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="new_password" class="form-label">New password</label>
                                <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" autocomplete="new-password">
                            </div>
                        </div>
                    </details>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('patient.dashboard') }}" class="btn btn-secondary">Back</a>
                        <button type="submit" class="btn btn-info text-white">Update Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
